<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vortex Notebook banner">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#2a1160"/>
      <stop offset="0.55" stop-color="#170a38"/>
      <stop offset="1" stop-color="#0a0518"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- centered vortex watermark -->
  <g transform="translate(600,150)" opacity="0.92">
    <ellipse cx="0" cy="0" rx="230" ry="86" fill="none" stroke="#5b3fa8" stroke-width="1.4" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="168" ry="62" fill="none" stroke="#5b3fa8" stroke-width="1.4" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="106" ry="39" fill="none" stroke="#7b5cc9" stroke-width="1.4" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="150" ry="150" fill="url(#core)"/>
    <!-- spiral arms: dots along logarithmic spirals -->
    <g fill="#8fd8ff">
      <!-- arm generator: r = 14 * exp(0.28*theta), 3 arms -->
      <g id="arm"/>
    </g>
    <g fill="#8fd8ff">
      <circle cx="18" cy="2" r="3.2"/><circle cx="26" cy="6" r="3.6"/><circle cx="34" cy="12" r="4.0"/><circle cx="41" cy="20" r="4.4"/><circle cx="48" cy="30" r="4.8"/>
      <circle cx="-18" cy="-2" r="3.2"/><circle cx="-26" cy="-6" r="3.6"/><circle cx="-34" cy="-12" r="4.0"/><circle cx="-41" cy="-20" r="4.4"/><circle cx="-48" cy="-30" r="4.8"/>
    </g>
    <g fill="#ffd97a">
      <circle cx="2" cy="-16" r="3.2"/><circle cx="6" cy="-24" r="3.6"/><circle cx="13" cy="-31" r="4.0"/><circle cx="21" cy="-37" r="4.4"/><circle cx="30" cy="-42" r="4.8"/>
      <circle cx="-2" cy="16" r="3.2"/><circle cx="-6" cy="24" r="3.6"/><circle cx="-13" cy="31" r="4.0"/><circle cx="-21" cy="37" r="4.4"/><circle cx="-30" cy="42" r="4.8"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="#ffe9b0"/>
  </g>
  <!-- centered wordmark over watermark -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="86" fill="#ffffff" font-size="56" font-weight="800" letter-spacing="2">Vortex <tspan fill="#ffd97a">Notebook</tspan></text>
    <text x="600" y="130" fill="#c9b6ee" font-size="21">an executable guide to periodic vortex dynamics</text>
    <text x="600" y="234" fill="#8a76b8" font-family="Consolas, monospace" font-size="16">ω̂ₜ = −i k·F[u ω] − ν k² ω̂ · strictly de-aliased · RK4</text>
    <text x="600" y="264" fill="#5f4d8c" font-family="Consolas, monospace" font-size="14">Taylor–Green error at the roundoff floor · tested package + executed notebook</text>
  </g>
</svg>
